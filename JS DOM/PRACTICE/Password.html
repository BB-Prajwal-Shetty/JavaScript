<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Password.css">
</head>
<body>
    <div id="container">
        <h1>User Details:</h1>
        <h2>First Name :<input type="text" name="" id="fn" placeholder="Enter First Name....."></h2>
        <h2>Last Name :<input type="text" name="" id="ln" placeholder="Enter Last Name....."></h2>
        <h2>Email :<input type="email" name="" id="em" placeholder="Enter Email....."></h2>
        <h2>Number :<input type="tel" name="" id="no" placeholder="Enter Contact Number....."></h2>
        <h2>Password : <input type="text" name="" id="ps" placeholder="Enter Password......"> </h2>
        <div id="pass"></div>
        <h2>Confirm Password : <input type="text" name="" id="cp" placeholder="Confirm Password......"> </h2>
        <button id="btn">Submit</button>
        <div id="alert"></div>
    </div>
